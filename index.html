<html lang="en">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Smart Email Builder</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#8b5cf6">

<style>
:root{--bg:#070916;--tx:#eef0ff;--mu:#9aa3cf;--card:rgba(255,255,255,.06);--bd:rgba(255,255,255,.12);--in:rgba(255,255,255,.07);--a:#8b5cf6;--b:#06b6d4;--c:#f472b6;--paper:#fff;--ptx:#1c1e33;color-scheme:dark}
[data-t=light]{--bg:#f1f0ff;--tx:#1c1e33;--mu:#5e6490;--card:rgba(255,255,255,.72);--bd:rgba(90,80,170,.18);--in:rgba(255,255,255,.95);color-scheme:light}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:system-ui,"Segoe UI",Tahoma,"Noto Sans",sans-serif;background:var(--bg);color:var(--tx);padding:18px;overflow-x:hidden}
.blob{position:fixed;width:420px;height:420px;border-radius:50%;filter:blur(90px);opacity:.45;z-index:-1;animation:fl 14s ease-in-out infinite alternate}
.b1{background:var(--a);top:-120px;left:-100px}.b2{background:var(--b);bottom:-140px;right:-100px;animation-delay:-5s}.b3{background:var(--c);top:40%;left:45%;width:260px;height:260px;opacity:.25;animation-delay:-9s}
@keyframes fl{to{transform:translate(60px,40px) scale(1.15)}}
@keyframes up{from{opacity:0;transform:translateY(14px)}}
@keyframes pop{from{opacity:.35;transform:translateY(12px) scale(.985)}}
@keyframes bob{50%{transform:translateY(-4px) rotate(-4deg)}}
.w{max-width:1040px;margin:auto}
header{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:18px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:1.5rem;background:linear-gradient(135deg,var(--a),var(--b));box-shadow:0 8px 24px rgba(139,92,246,.45);animation:bob 4s ease-in-out infinite}
h1{margin:0;font-size:1.6rem;letter-spacing:-.02em}
.tools{display:flex;gap:8px}
.g{display:grid;grid-template-columns:1fr 1.1fr;gap:18px;align-items:start}
@media(max-width:800px){.g{grid-template-columns:1fr}}
.c{background:var(--card);border:1px solid var(--bd);border-radius:24px;padding:20px;backdrop-filter:blur(18px);box-shadow:0 20px 50px rgba(0,0,0,.18)}
.sticky{position:sticky;top:14px}
.st{display:flex;align-items:center;gap:10px;margin:16px 0 8px;font-size:.78rem;text-transform:uppercase;letter-spacing:.06em;color:var(--mu)}
.st:first-child{margin-top:0}
.st b{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,var(--a),var(--b));color:#fff;font-size:.72rem}
input,select,textarea{width:100%;padding:11px 14px;border:1px solid var(--bd);border-radius:14px;background:var(--in);color:var(--tx);font:inherit;outline:none;transition:.2s}
input:focus,select:focus,textarea:focus{border-color:var(--a);box-shadow:0 0 0 3px rgba(139,92,246,.25)}
select option{color:#111}
textarea{min-height:76px;resize:vertical}
.fl{display:block;font-size:.72rem;color:var(--mu)}
.fl span{display:block;margin:0 4px 4px}
.chips{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media(max-width:480px){.chips{grid-template-columns:repeat(2,1fr)}}
.chip{padding:10px 4px;border:1px solid var(--bd);border-radius:14px;background:var(--in);color:var(--tx);cursor:pointer;font:inherit;font-size:.78rem;transition:.2s;word-break:break-word}
.chip:hover{transform:translateY(-2px);border-color:var(--a)}
.chip:active{transform:scale(.95)}
.chip i{display:block;font-style:normal;font-size:1.4rem;margin-bottom:2px}
.chip.on{border-color:transparent;background:linear-gradient(135deg,var(--a),var(--b));color:#fff;box-shadow:0 8px 20px rgba(139,92,246,.4)}
.seg{display:flex;gap:6px}.seg .chip{flex:1}
.r2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{position:relative;overflow:hidden;width:100%;margin-top:14px;padding:14px;border:0;border-radius:16px;font:inherit;font-weight:700;color:#fff;cursor:pointer;background:linear-gradient(90deg,var(--a),var(--c));box-shadow:0 10px 26px rgba(244,114,182,.35);transition:transform .2s,box-shadow .2s}
.btn:hover{transform:translateY(-2px);box-shadow:0 14px 32px rgba(244,114,182,.5)}
.btn:active{transform:scale(.98)}
.btn::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.35) 50%,transparent 70%);transform:translateX(-100%)}
.btn:hover::after{transform:translateX(100%);transition:transform .7s}
.micbox{display:flex;gap:14px;align-items:center;margin-bottom:14px}
.micbox>div{flex:1}
.mic{width:68px;height:68px;border-radius:50%;border:0;font-size:1.8rem;cursor:pointer;color:#fff;background:linear-gradient(135deg,var(--a),var(--c));box-shadow:0 10px 28px rgba(139,92,246,.5);flex:none;transition:transform .2s}
.mic:hover{transform:scale(1.07)}
.mic.on{animation:pl 1.1s infinite;background:linear-gradient(135deg,#ef4444,#f97316)}
@keyframes pl{0%{box-shadow:0 0 0 0 rgba(239,68,68,.6)}100%{box-shadow:0 0 0 26px rgba(239,68,68,0)}}
.ms{font-size:.82rem;color:var(--mu);margin-top:6px;min-height:1.2em}
.paper{background:var(--paper);color:var(--ptx);border-radius:18px;overflow:hidden;box-shadow:0 14px 36px rgba(0,0,0,.25)}
.paper.pop{animation:pop .45s ease}
.bar{display:flex;align-items:center;gap:8px;padding:6px 14px;border-bottom:1px solid #e6e8f2;background:#f6f7fd}
.paper input,.paper textarea{background:transparent;border:0;border-radius:0;color:var(--ptx);box-shadow:none}
.paper input{font-weight:700}
.paper textarea{min-height:270px;line-height:1.75;padding:14px 18px}
.wc{color:#8a90b5;font-size:.7rem;white-space:nowrap}
.acts{display:flex;gap:8px;margin-top:12px}
.ib{padding:10px 14px;border:1px solid var(--bd);border-radius:14px;background:var(--in);color:var(--tx);cursor:pointer;font:inherit;transition:.2s}
.ib:hover{transform:translateY(-2px);border-color:var(--a)}
.ib:active{transform:scale(.96)}
.acts .ib:nth-child(-n+2){flex:1}
.hist{margin-top:12px;border:1px solid var(--bd);border-radius:16px;background:var(--in);padding:10px;max-height:240px;overflow:auto;animation:up .3s}
.hh{display:flex;justify-content:space-between;align-items:center;font-size:.8rem;color:var(--mu);margin-bottom:6px}
.hi{display:flex;gap:6px;align-items:center;margin-bottom:6px}
.hl{flex:1;text-align:start;background:transparent;border:1px solid var(--bd);border-radius:12px;padding:8px 10px;color:var(--tx);font:inherit;cursor:pointer;display:flex;flex-direction:column;gap:2px;min-width:0}
.hl b{font-size:.85rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hl small{color:var(--mu);font-size:.7rem}
.hl:hover{border-color:var(--a)}
.hx{background:transparent;border:0;color:var(--mu);cursor:pointer;font-size:.9rem}
.he{text-align:center;color:var(--mu)}
.sm{padding:4px 10px;font-size:.8rem}
.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);padding:10px 18px;border-radius:999px;background:rgba(20,22,45,.92);color:#fff;font-size:.85rem;opacity:0;pointer-events:none;transition:.3s;z-index:9;border:1px solid var(--bd)}
.toast.on{opacity:1;transform:translate(-50%,0)}
.boot .c{animation:up .6s both}
.boot .c:nth-child(2){animation-delay:.12s}
.boot .chip{animation:up .5s both;animation-delay:calc(var(--i,0)*40ms)}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>

</main>

  const r=await fetch('https://api.languagetool.org/v2/check',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:'language=en-US&text='+encodeURIComponent(t)});
  const j=await r.json(),names=($('to').value+' '+$('me').value).toLowerCase();
  let out=t,lim=Infinity;
  j.matches.sort((a,b)=>b.offset-a.offset).forEach(m=>{
    const rep=m.replacements[0];if(!rep||m.offset+m.length>lim)return;
    const w=t.substr(m.offset,m.length);
    if(m.rule.issueType==='misspelling'&&(/^[A-Z]/.test(w)||names.includes(w.toLowerCase())))return;
    out=out.slice(0,m.offset)+rep.value+out.slice(m.offset+m.length);lim=m.offset;
  });
  return out;
}
